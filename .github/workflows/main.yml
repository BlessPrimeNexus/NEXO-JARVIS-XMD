name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name NEXO-JARVIS-XMD.zip -exec rm -rf {} +
          unzip -o NEXO-JARVIS-XMD.zip
          rm NEXO-JARVIS-XMD.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update project"
          git push
