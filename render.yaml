# ⚠️ Configuration adaptée au plan FREE de Render (pas de disque persistant).
#    Conséquence : le dossier de sessions est éphémère. Chaque fois que le
#    service redémarre (mise en veille après inactivité, redéploiement,
#    crash...), les numéros liés sont perdus et il faut refaire .pair.
#    Pour garder les sessions en permanence, il faut passer sur le plan
#    Starter (payant) et remettre un bloc "disk:" ici.
services:
  - type: web
    name: nexo-jarvis-xmd
    env: node
    plan: free
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: OWNER_NUMBER
        sync: false
      - key: BOT_NUMBER
        sync: false
      - key: SESSION_DIR
        value: /opt/render/project/src/sessions # éphémère sur le plan free
      - key: HOST
        value: 0.0.0.0
      - key: RESTORE_CONCURRENCY
        value: "2"
      - key: MESSAGE_CONCURRENCY
        value: "4"
      - key: MAX_MESSAGE_QUEUE
        value: "250"
      - key: PAIRING_RATE_MAX
        value: "5"
      - key: PAIRING_RATE_WINDOW_MS
        value: "600000"
      - key: MAX_PAIRING_RECOVERY_ATTEMPTS
        value: "10"
      - key: MAX_RECONNECT_ATTEMPTS
        value: "10"
      - key: WORKER_ID
        value: worker-1
      - key: MAX_WORKERS
        value: "1"
      - key: WORKER_MAX_SESSIONS
        value: "100"
      - key: STORAGE
        value: local
      - key: SESSION_REGISTRY_FILE
        value: /opt/render/project/src/sessions/registry.json # éphémère sur le plan free
      - key: ADMIN_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: nexo-jarvis-xmd
          property: host
